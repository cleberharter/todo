name: CI

on:
  pull_request:
    branches: ['**']

jobs:
  backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore backend/TodoApi/TodoApi.csproj
          dotnet restore backend/TodoApi.Tests/TodoApi.Tests.csproj

      - name: Build
        run: dotnet build backend/TodoApi/TodoApi.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/TodoApi.Tests/TodoApi.Tests.csproj --no-restore --configuration Release

  frontend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
