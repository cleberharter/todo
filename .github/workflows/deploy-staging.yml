name: Deploy Staging

on:
  push:
    branches: [staging]
  pull_request:
    types: [closed]
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      backend_app_name: app-todo-staging
      acr_name: acrtodo
      api_url: https://app-todo-staging.azurewebsites.net/api/todoitems
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

  create-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request to hml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --repo "${{ github.repository }}" --base hml --head staging --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR staging -> hml já existe, nada a fazer."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base hml \
              --head staging \
              --title "Send code from staging to hml" \
              --body "PR automático gerado após merge em staging."
          fi
