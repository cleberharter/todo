name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore backend/TodoApi/TodoApi.csproj
          dotnet restore backend/TodoApi.Tests/TodoApi.Tests.csproj

      - name: Build
        run: dotnet build backend/TodoApi/TodoApi.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/TodoApi.Tests/TodoApi.Tests.csproj --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      backend_app_name: app-todo-staging
      acr_name: acrtodo
      api_url: https://app-todo-staging.azurewebsites.net/api/todoitems
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request to hml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --repo "${{ github.repository }}" --base hml --head staging --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR staging -> hml já existe, nada a fazer."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base hml \
              --head staging \
              --title "Send code from staging to hml" \
              --body "PR automático gerado após merge em staging."
          fi
