name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Nome do ambiente (staging, hml, production)'
        required: true
        type: string
      backend_app_name:
        description: 'Nome do Azure App Service do backend'
        required: true
        type: string
      acr_name:
        description: 'Nome do Azure Container Registry'
        required: true
        type: string
      api_url:
        description: 'URL da API usada no build do frontend'
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: ACR login
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Build & push backend image
        run: |
          IMAGE=${{ inputs.acr_name }}.azurecr.io/todo-backend:${{ inputs.environment }}
          docker build -t "$IMAGE" -t "${IMAGE}-${{ github.sha }}" ./backend/TodoApi
          docker push "$IMAGE"
          docker push "${IMAGE}-${{ github.sha }}"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.backend_app_name }}
          images: ${{ inputs.acr_name }}.azurecr.io/todo-backend:${{ inputs.environment }}

      - name: Azure logout
        if: always()
        run: az logout

  deploy-frontend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/dist'
          skip_app_build: true
          output_location: ''
