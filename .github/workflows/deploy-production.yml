name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore backend/TodoApi/TodoApi.csproj
          dotnet restore backend/TodoApi.Tests/TodoApi.Tests.csproj

      - name: Build
        run: dotnet build backend/TodoApi/TodoApi.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/TodoApi.Tests/TodoApi.Tests.csproj --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      backend_app_name: app-todo-production
      acr_name: acrtodo
      api_url: https://app-todo-production.azurewebsites.net/api/todoitems
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
