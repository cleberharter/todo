name: Infra (Terraform)

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack a aplicar'
        required: true
        type: choice
        options: [shared, staging, hml, production]
      action:
        description: 'Ação do Terraform'
        required: true
        type: choice
        options: [plan, apply]

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack == 'shared' && 'shared' || inputs.stack }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Determine working directory
        id: workdir
        run: |
          if [ "${{ inputs.stack }}" = "shared" ]; then
            echo "dir=infra/shared" >> "$GITHUB_OUTPUT"
          else
            echo "dir=infra/environments" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Init
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.stack }}/terraform.tfstate"

      - name: Terraform Plan
        if: inputs.stack == 'shared'
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: terraform plan -out=tfplan

      - name: Terraform Plan (environment)
        if: inputs.stack != 'shared'
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: |
          terraform plan \
            -var-file="envs/${{ inputs.stack }}.tfvars" \
            -var="tfstate_resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -var="tfstate_storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -var="tfstate_container_name=${{ vars.TFSTATE_CONTAINER_NAME }}" \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: terraform apply -auto-approve tfplan
