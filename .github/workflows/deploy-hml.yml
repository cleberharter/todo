name: Deploy Hml

on:
  push:
    branches: [hml]
  pull_request:
    types: [closed]
    branches: [hml]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: hml
      backend_app_name: app-todo-hml
      acr_name: acrtodo
      api_url: https://app-todo-hml.azurewebsites.net/api/todoitems
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

  create-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --repo "${{ github.repository }}" --base main --head hml --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR hml -> main já existe, nada a fazer."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head hml \
              --title "Send code from hml to main" \
              --body "PR automático gerado após merge em hml."
          fi
